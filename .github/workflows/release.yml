name: Release

# Creates a GitHub release as soon as main has a new version in
# manifest.json. The release notes come from CHANGELOG.md.
on:
  push:
    branches: [main]
    paths:
      - custom_components/switchmanager/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(jq -r .version custom_components/switchmanager/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists."
            exit 0
          fi
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "$VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
